replicaCount: 2

image:
  repository: amimbaig/order-api
  tag: "1.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

config:
  inventoryApiUrl: "http://inventory-api:8000"

otel:
  exporterOtlpEndpoint: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
  serviceName: "order-api"
  environment: "production"
