replicaCount: 2

image:
  repository: amimbaig/inventory-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

config:
  redisHost: "redis.redis.svc.cluster.local"
  redisPort: "6379"

autoscaling:
  enabled: false

otel:
  exporterOtlpEndpoint: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
  serviceName: "inventory-api"
  environment: "production"
