services:

  order-api:
    image: order-api:1.1.0
    container_name: order-api
    ports:
      - "8000:8000"
    environment:
      INVENTORY_API_URL: http://inventory-api:8000
    depends_on:
      - inventory-api

  inventory-api:
    image: inventory-api:1.0.0
    container_name: inventory-api
    ports:
      - "8001:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    ports:
      - "6379:6379"
