apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventory-api
  labels:
    app: inventory-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: inventory-api

  template:
    metadata:
      labels:
        app: inventory-api

    spec:
      containers:
        - name: inventory-api
          image: inventory-api:1.0.0
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          ports:
            - containerPort: 8000

          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: REDIS_PORT

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
